name: build-exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Сборка
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"; case "$VER" in [0-9]*) ;; *) VER=1.0.0;; esac
          dotnet publish native/Loader.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:Version=$VER -o out
          mv out/Cl4nLoader.exe out/764CL4N-Loader.exe
      - uses: actions/upload-artifact@v4
        with:
          name: 764CL4N-Loader
          path: out/764CL4N-Loader.exe
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/764CL4N-Loader.exe
