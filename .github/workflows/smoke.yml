name: smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [main, master]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: HTTP smoke against live site
        run: node smoke.mjs
        env:
          SMOKE_URL: https://young-wave-cd63.764cl4n.workers.dev/
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Browser smoke (clicks)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node smoke.mjs --browser
        env:
          SMOKE_URL: https://young-wave-cd63.764cl4n.workers.dev/
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
